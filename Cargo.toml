[package]
name = "rustic-vs"
version = "0.1.0"
edition = "2024"
authors = ["tekunogosu"]

[dependencies]
colored = "3.0.0"
dirs = "6.0.0"
json5 = "0.4.1"
prettytable-rs = "0.10.0"
reqwest = { version = "0.12.15", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["rt", "rt-multi-thread", "macros"] }
zip = "2.6.1"
